name: inGitDB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ingitdb:
    name: Validate & Materialize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6

      # ingitdb-action validates with an exact, checksum-verified CLI release and
      # must be pinned by commit SHA (see its README). It no longer takes `args`
      # or runs materialize, so that step is gone. Same pins as demo-ingitdb.
      - name: Validate schema & data
        uses: ingitdb/ingitdb-action@ec621991c6ca57d45a252c7d140eea1624f42ab9
        with:
          cli-version: v0.66.0
          database-root: .
